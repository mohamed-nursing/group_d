<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nursing Group D Portal | بوابة تمريض جروب D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />

  <!-- React 18, Babel & GSAP Animation Engine -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <style>
    :root {
      --bg-main: #f0f6fc;
      --bg-surface: rgba(255, 255, 255, 0.82);
      --bg-card: rgba(255, 255, 255, 0.94);
      --bg-elevated: #e6eff8;
      --text-primary: #09111e;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --border-color: rgba(14, 165, 233, 0.18);
      --accent: #0d9488;
      --accent-2: #0284c7;
      --accent-3: #6366f1;
      --accent-glow: rgba(13, 148, 136, 0.22);
      --danger: #e11d48;
      --shadow-card: 0 14px 34px -10px rgba(15, 23, 42, 0.09);
      --shadow-hover: 0 26px 54px -12px rgba(13, 148, 136, 0.26);
      --radius-xl: 26px;
      --radius-lg: 18px;
      --radius-md: 13px;
    }

    [data-theme="dark"] {
      --bg-main: #040812;
      --bg-surface: rgba(11, 18, 34, 0.78);
      --bg-card: rgba(15, 23, 42, 0.88);
      --bg-elevated: #1e293b;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --border-color: rgba(45, 212, 191, 0.18);
      --accent: #2dd4bf;
      --accent-2: #38bdf8;
      --accent-3: #818cf8;
      --accent-glow: rgba(45, 212, 191, 0.24);
      --danger: #fb7185;
      --shadow-card: 0 16px 40px -10px rgba(0, 0, 0, 0.55);
      --shadow-hover: 0 28px 60px -12px rgba(45, 212, 191, 0.28);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Cairo', 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-primary);
      line-height: 1.65;
      min-height: 100vh;
      overflow-x: hidden;
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    .en {
      font-family: 'Plus Jakarta Sans', 'Cairo', sans-serif;
      direction: ltr;
      display: inline-block;
    }

    #dnaCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
      pointer-events: none;
    }

    .aurora-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      z-index: -1;
      pointer-events: none;
      opacity: 0.5;
      animation: auroraDrift 16s ease-in-out infinite alternate;
    }

    .orb-a {
      width: 440px;
      height: 440px;
      background: radial-gradient(circle, var(--accent-glow), transparent 70%);
      top: -120px;
      right: -80px;
    }

    .orb-b {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(2, 132, 199, 0.18), transparent 70%);
      bottom: -80px;
      left: -100px;
      animation-delay: -7s;
    }

    @keyframes auroraDrift {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-45px, 50px) scale(1.16); }
    }

    .container {
      width: 100%;
      max-width: 1240px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* Navbar */
    header {
      position: sticky;
      top: 0;
      z-index: 60;
      background: var(--bg-surface);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-color);
    }

    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 76px;
      gap: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
      text-decoration: none;
      color: var(--text-primary);
      user-select: none;
      cursor: pointer;
    }

    .brand-logo {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2), var(--accent-3));
      background-size: 200% 200%;
      animation: gradientShift 6s ease infinite;
      display: grid;
      place-items: center;
      color: #ffffff;
      box-shadow: 0 8px 22px var(--accent-glow);
      flex-shrink: 0;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .brand-title h1 {
      font-size: 1.12rem;
      font-weight: 800;
      line-height: 1.2;
    }

    .brand-title span {
      font-size: 0.78rem;
      color: var(--text-secondary);
      font-weight: 600;
      display: block;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: var(--radius-md);
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid transparent;
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.25s ease, border-color 0.25s ease, color 0.25s ease;
      text-decoration: none;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #ffffff;
      box-shadow: 0 6px 20px var(--accent-glow);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px var(--accent-glow);
    }

    .btn-glass {
      background: var(--bg-card);
      color: var(--text-primary);
      border-color: var(--border-color);
    }

    .btn-glass:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-2px);
    }

    .icon-btn {
      width: 42px;
      height: 42px;
      padding: 0;
    }

    /* Animated Border Hero Box */
    .hero {
      padding: 32px 0 24px;
    }

    .hero-frame {
      position: relative;
      border-radius: 30px;
      padding: 1.5px;
      background: linear-gradient(120deg, var(--border-color), var(--accent), var(--accent-2), var(--border-color));
      background-size: 250% 250%;
      animation: borderFlow 8s linear infinite;
      box-shadow: var(--shadow-card);
    }

    @keyframes borderFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .hero-box {
      background: var(--bg-card);
      backdrop-filter: blur(22px);
      border-radius: 28.5px;
      padding: 36px;
      display: grid;
      grid-template-columns: 1.35fr 0.85fr;
      gap: 30px;
      align-items: center;
    }

    .hero-pill {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 6px 15px;
      border-radius: 999px;
      background: var(--accent-glow);
      color: var(--accent);
      font-size: 0.82rem;
      font-weight: 800;
      margin-bottom: 16px;
    }

    .live-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulseDot 2s infinite;
    }

    @keyframes pulseDot {
      0% { box-shadow: 0 0 0 0 rgba(13, 148, 136, 0.65); }
      70% { box-shadow: 0 0 0 10px rgba(13, 148, 136, 0); }
      100% { box-shadow: 0 0 0 0 rgba(13, 148, 136, 0); }
    }

    .hero h2 {
      font-size: clamp(1.65rem, 3vw, 2.38rem);
      font-weight: 900;
      line-height: 1.3;
      margin-bottom: 22px;
    }

    .gradient-text {
      background: linear-gradient(135deg, var(--accent), var(--accent-2), var(--accent-3));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .search-wrapper {
      position: relative;
      max-width: 500px;
    }

    .search-wrapper svg {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .search-wrapper input {
      width: 100%;
      padding: 14px 46px 14px 18px;
      border-radius: 15px;
      border: 1.5px solid var(--border-color);
      background: var(--bg-main);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.94rem;
      font-weight: 600;
      outline: none;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .search-wrapper input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-glow);
    }

    /* Telemetry Panel */
    .telemetry-card {
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: 22px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .ecg-screen {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 12px 16px;
      overflow: hidden;
    }

    .ecg-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.76rem;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 6px;
    }

    .ecg-svg {
      width: 100%;
      height: 44px;
      stroke: var(--accent);
      stroke-width: 2.5;
      fill: none;
      stroke-dasharray: 440;
      stroke-dashoffset: 440;
      animation: ecgFlow 2.6s linear infinite;
      filter: drop-shadow(0 0 7px var(--accent-glow));
    }

    @keyframes ecgFlow {
      to { stroke-dashoffset: 0; }
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .kpi-item {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 12px 8px;
      text-align: center;
      transition: transform 0.25s ease, border-color 0.25s ease;
    }

    .kpi-item:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
    }

    .kpi-item strong {
      display: block;
      font-size: 1.38rem;
      font-weight: 900;
      color: var(--text-primary);
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .kpi-item span {
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--text-secondary);
    }

    /* Subjects */
    .section-title {
      font-size: 0.92rem;
      font-weight: 800;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }

    .subjects-scroller {
      display: flex;
      gap: 11px;
      overflow-x: auto;
      padding: 4px 2px 12px;
      margin-bottom: 18px;
      scrollbar-width: none;
    }

    .subjects-scroller::-webkit-scrollbar {
      display: none;
    }

    .subject-chip {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 18px;
      border-radius: 16px;
      background: var(--bg-card);
      border: 1.5px solid var(--border-color);
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .subject-chip:hover {
      border-color: var(--accent);
      color: var(--text-primary);
      transform: translateY(-3px);
    }

    .subject-chip.active {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-color: transparent;
      color: #ffffff;
      box-shadow: 0 10px 24px var(--accent-glow);
      transform: translateY(-2px);
    }

    .chip-count {
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 0.76rem;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg-elevated);
      color: var(--text-primary);
    }

    .subject-chip.active .chip-count {
      background: rgba(255, 255, 255, 0.25);
      color: #ffffff;
    }

    /* Category Tabs */
    .category-tabs {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 6px;
      background: var(--bg-card);
      padding: 6px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      margin-bottom: 24px;
    }

    .cat-tab {
      padding: 9px 17px;
      border-radius: 11px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.24s ease;
    }

    .cat-tab:hover {
      color: var(--text-primary);
    }

    .cat-tab.active {
      background: var(--accent-glow);
      color: var(--accent);
      box-shadow: inset 0 0 0 1px var(--accent);
    }

    /* 3D Interactive Cards */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 22px;
      margin-bottom: 64px;
      perspective: 1200px;
    }

    .resource-card {
      position: relative;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 18px;
      box-shadow: var(--shadow-card);
      transform-style: preserve-3d;
      transition: transform 0.16s ease-out, box-shadow 0.28s ease, border-color 0.28s ease;
      overflow: hidden;
    }

    .resource-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(400px circle at var(--mx, 50%) var(--my, 50%), var(--accent-glow), transparent 65%);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .resource-card:hover::before {
      opacity: 1;
    }

    .resource-card:hover {
      border-color: var(--accent);
      box-shadow: var(--shadow-hover);
    }

    .card-badges {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .badge-subject {
      font-size: 0.76rem;
      font-weight: 800;
      padding: 4px 11px;
      border-radius: 9px;
      background: var(--bg-elevated);
      color: var(--text-primary);
    }

    .badge-type {
      font-size: 0.75rem;
      font-weight: 800;
      padding: 4px 11px;
      border-radius: 9px;
    }

    .badge-slides {
      background: rgba(2, 132, 199, 0.14);
      color: #0284c7;
    }

    [data-theme="dark"] .badge-slides {
      color: #38bdf8;
    }

    .badge-quiz {
      background: rgba(13, 148, 136, 0.15);
      color: var(--accent);
    }

    .badge-videos {
      background: rgba(234, 88, 12, 0.14);
      color: #ea580c;
    }

    [data-theme="dark"] .badge-videos {
      color: #fb923c;
    }

    .card-content h3 {
      font-size: 1.07rem;
      font-weight: 800;
      margin-bottom: 6px;
      line-height: 1.45;
    }

    .card-sub {
      font-size: 0.84rem;
      color: var(--text-secondary);
      font-weight: 600;
    }

    .card-footer {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-top: 14px;
      border-top: 1px solid var(--border-color);
    }

    .card-footer .btn-primary {
      flex: 1;
    }

    .btn-delete {
      color: var(--danger);
    }

    .btn-delete:hover {
      border-color: var(--danger);
      color: var(--danger);
    }

    .empty-box {
      grid-column: 1 / -1;
      text-align: center;
      padding: 64px 20px;
      background: var(--bg-card);
      border: 1.5px dashed var(--border-color);
      border-radius: var(--radius-xl);
      color: var(--text-secondary);
      font-weight: 700;
    }

    /* Modals */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(4, 8, 18, 0.76);
      backdrop-filter: blur(10px);
      display: grid;
      place-items: center;
      padding: 18px;
      z-index: 120;
      animation: fadeOverlay 0.22s ease;
    }

    @keyframes fadeOverlay {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-panel {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      width: 100%;
      max-width: 520px;
      padding: 28px;
      box-shadow: 0 30px 65px rgba(0, 0, 0, 0.45);
      animation: modalSpring 0.34s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes modalSpring {
      from { opacity: 0; transform: scale(0.92) translateY(16px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .modal-top h3 {
      font-size: 1.15rem;
      font-weight: 800;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 0.83rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--text-secondary);
    }

    .field input,
    .field select {
      width: 100%;
      padding: 11px 14px;
      border-radius: 12px;
      border: 1.5px solid var(--border-color);
      background: var(--bg-main);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      outline: none;
    }

    .field input:focus,
    .field select:focus {
      border-color: var(--accent);
    }

    .modal-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    .modal-actions .btn {
      flex: 1;
    }

    .tip-box {
      margin-top: 15px;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--bg-elevated);
      font-size: 0.81rem;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    footer {
      border-top: 1px solid var(--border-color);
      padding: 24px 0;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
      background: var(--bg-surface);
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 24px;
      background: var(--text-primary);
      color: var(--bg-card);
      padding: 12px 18px;
      border-radius: 13px;
      font-size: 0.86rem;
      font-weight: 700;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.3);
      z-index: 200;
      animation: toastSlide 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes toastSlide {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 880px) {
      .hero-box {
        grid-template-columns: 1fr;
        padding: 24px;
      }
    }

    @media (max-width: 540px) {
      .brand-title span { display: none; }
      .hide-mobile { display: none; }
    }
  </style>
</head>

  <!-- 3D Rotating DNA Double-Helix & Cellular Particles Engine -->
  <script>
    (function init3DDnaEngine() {
      const canvas = document.getElementById("dnaCanvas");
      const ctx = canvas.getContext("2d");
      let w, h, phase = 0;
      const mouse = { x: 0, y: 0, targetX: 0, targetY: 0 };

      const particles = Array.from({ length: 42 }, () => ({
        x: Math.random(),
        y: Math.random(),
        r: Math.random() * 2 + 1,
        vx: (Math.random() - 0.5) * 0.0005,
        vy: (Math.random() - 0.5) * 0.0005
      }));

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      }

      window.addEventListener("resize", resize);
      window.addEventListener("mousemove", e => {
        mouse.targetX = (e.clientX / w - 0.5) * 40;
        mouse.targetY = (e.clientY / h - 0.5) * 30;
      });
      resize();

      function render() {
        ctx.clearRect(0, 0, w, h);
        phase += 0.018;
        mouse.x += (mouse.targetX - mouse.x) * 0.06;
        mouse.y += (mouse.targetY - mouse.y) * 0.06;

        const isDark = document.documentElement.getAttribute("data-theme") === "dark";
        const c1 = isDark ? "45, 212, 191" : "13, 148, 136";
        const c2 = isDark ? "56, 189, 248" : "2, 132, 199";

        // Ambient floating particles
        particles.forEach(p => {
          p.x = (p.x + p.vx + 1) % 1;
          p.y = (p.y + p.vy + 1) % 1;
          ctx.beginPath();
          ctx.arc(p.x * w, p.y * h, p.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${c1}, ${isDark ? 0.25 : 0.18})`;
          ctx.fill();
        });

        // 3D DNA Double Helix along the left/background
        const helixX = (w < 768 ? w * 0.5 : w * 0.16) + mouse.x;
        const pairs = 26;
        const spacing = (h + 120) / pairs;
        const radius = w < 768 ? 55 : 78;

        for (let i = 0; i < pairs; i++) {
          const y = i * spacing - 60 + mouse.y * 0.4;
          const angle = phase + i * 0.34;
          const sinA = Math.sin(angle);
          const cosA = Math.cos(angle);

          const x1 = helixX + sinA * radius;
          const x2 = helixX - sinA * radius;
          const scale1 = (cosA + 1.8) * 0.55;
          const scale2 = (-cosA + 1.8) * 0.55;

          // Base-pair rung
          ctx.beginPath();
          ctx.moveTo(x1, y);
          ctx.lineTo(x2, y);
          ctx.strokeStyle = `rgba(${c2}, ${isDark ? 0.16 : 0.12})`;
          ctx.lineWidth = 1.4;
          ctx.stroke();

          // Strand A node
          ctx.beginPath();
          ctx.arc(x1, y, 3.2 * scale1, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${c1}, ${0.22 * scale1})`;
          ctx.fill();

          // Strand B node
          ctx.beginPath();
          ctx.arc(x2, y, 3.2 * scale2, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${c2}, ${0.22 * scale2})`;
          ctx.fill();
        }

        requestAnimationFrame(render);
      }
      render();
    })();
  </script>

    function ResourceCard({ item, isAdmin, onCopy, onDelete }) {
      const cardRef = useRef(null);

      const handleMouseMove = (e) => {
        const el = cardRef.current;
        if (!el) return;
        const rect = el.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        el.style.setProperty("--mx", `${x}px`);
        el.style.setProperty("--my", `${y}px`);
        const rotY = ((x / rect.width) - 0.5) * 9;
        const rotX = ((y / rect.height) - 0.5) * -9;
        el.style.transform = `perspective(1000px) rotateX(${rotX}deg) rotateY(${rotY}deg) translateY(-5px)`;
      };

      const handleMouseLeave = () => {
        const el = cardRef.current;
        if (!el) return;
        el.style.transform = "perspective(1000px) rotateX(0deg) rotateY(0deg) translateY(0px)";
      };

      const badgeMeta = {
        slides: { text: "Slides • محاضرات", cls: "badge-slides" },
        quiz: { text: "Quiz & Bank • أسئلة", cls: "badge-quiz" },
        videos: { text: "Videos • فيديوهات", cls: "badge-videos" }
      }[item.category] || { text: "Slides", cls: "badge-slides" };

      return (
        <article
          ref={cardRef}
          className="resource-card"
          onMouseMove={handleMouseMove}
          onMouseLeave={handleMouseLeave}

              <span className="badge-subject en">{item.subject}</span>
              <span className={`badge-type ${badgeMeta.cls}`}>{badgeMeta.text}</span>
            </div>

              <h3 className="en" style={{ direction: "auto", textAlign: "start" }}>{item.title}</h3>
              <div className="card-sub">{item.doctor || "Google Drive"}</div>
            </div>
          </div>

          <div className="card-footer">
            <a href={item.url} target="_blank" rel="noopener noreferrer" className="btn btn-primary">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.3">
                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                <polyline points="15 3 21 3 21 9"/>
                <line x1="10" y1="14" x2="21" y2="3"/>
              </svg>
              فتح في Drive
            </a>

            <button className="btn btn-glass icon-btn" onClick={() => onCopy(item.url)} title="نسخ الرابط">

                <rect width="14" height="14" x="8" y="8" rx="2"/>
                <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
              </svg>
            </button>

              <button className="btn btn-glass icon-btn btn-delete" onClick={() => onDelete(item.id)} title="حذف العنصر">

                  <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                </svg>
              </button>
            )}
          </div>
        </article>
      );
    }

      const filteredResources = useMemo(() => {

        return resources.filter((item) => {
          const matchSubj = subject === "All" || item.subject === subject;
          const matchCat = category === "all" || item.category === category;
          const matchQ =
            !q ||
            item.title.toLowerCase().includes(q) ||
            item.subject.toLowerCase().includes(q) ||
            (item.doctor && item.doctor.toLowerCase().includes(q));
          return matchSubj && matchCat && matchQ;
        });
      }, [resources, subject, category, search]);

        const cards = gridRef.current.querySelectorAll(".resource-card");

            { opacity: 0, y: 26, rotateX: 8, scale: 0.96 },

          setIsAdmin(true);
          setShowAuthModal(false);
          setPasswordInput("");
          triggerToast("تم تفعيل وضع التحكم بنجاح");
        } else {
          triggerToast("كلمة المرور غير صحيحة");

      const handleAddItem = (e) => {
        e.preventDefault();
        if (!isAdmin) return;
        const newItem = {
          id: Date.now(),
          subject: formState.subject,
          category: formState.category,
          title: formState.title.trim(),
          doctor: formState.doctor.trim() || "Google Drive",
          url: formState.url.trim()
        };
        setResources((prev) => [newItem, ...prev]);
        setFormState({ ...formState, title: "", doctor: "", url: "" });
        triggerToast("تمت الإضافة! اضغط 'تحميل index.html' لحفظ التعديل ورفعه على GitHub.");
      };

      const handleDeleteItem = (id) => {

        setResources((prev) => prev.filter((item) => item.id !== id));

      };

      const exportCleanIndexHtml = () => {
        if (!isAdmin) return;
        setShowManageModal(false);

        const clone = document.documentElement.cloneNode(true);
        clone.setAttribute("data-theme", "light");
        const dataScript = clone.querySelector("#initial-data");
        if (dataScript) {
          dataScript.textContent = "\n" + JSON.stringify(resources, null, 2) + "\n  ";
        }
        const rootDiv = clone.querySelector("#root");
        if (rootDiv) {
          rootDiv.innerHTML = "";
        }

        const htmlString = "<!DOCTYPE html>\n" + clone.outerHTML;
        const blob = new Blob([htmlString], { type: "text/html;charset=utf-8" });
        const link = document.createElement("a");

        link.download = "index.html";
        link.click();
        URL.revokeObjectURL(link.href);
        triggerToast("تم تحميل ملف index.html المحدّث وجاهز للرفع على GitHub!");
      };

      const slidesCount = resources.filter((r) => r.category === "slides").length;
      const extrasCount = resources.filter((r) => r.category !== "slides").length;

      return (
        <>
          <header>

                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
                  </svg>
                </div>
                <div className="brand-title">
                  <h1 className="en">Nursing Group D Portal</h1>
                  <span>بوابة المحاضرات والأسئلة &bull; جروب D</span>
                </div>
              </a>

              <div className="nav-actions">
                {isAdmin && (
                  <>
                    <button className="btn btn-primary" onClick={() => setShowManageModal(true)}>
                      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4">
                        <path d="M12 5v14M5 12h14" />
                      </svg>
                      <span className="hide-mobile">إدارة الروابط</span>
                    </button>
                    <button

                      onClick={() => {
                        setIsAdmin(false);

                        <rect width="18" height="11" x="3" y="11" rx="2" />
                        <path d="M7 11V7a5 5 0 0 1 10 0v4" />

                    </button>

                </form>

                <div className="tip-box">
                  <strong>تحديث GitHub:</strong> بعد إضافة أو حذف أي رابط، اضغط <b>تحميل index.html</b> ثم ارفعه مكان الملف القديم في مستودع GitHub ليظهر التحديث للجميع.
                </div>
              </div>
            </div>
          )}

          {toastMsg && <div className="toast">{toastMsg}</div>}
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
